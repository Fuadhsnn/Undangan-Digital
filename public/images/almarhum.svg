<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F1E9"/>
      <stop offset="50%" stop-color="#EDE6D8"/>
      <stop offset="100%" stop-color="#DFD6C3"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#9C7A4A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9C7A4A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="islamicPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#2D4030" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#9C7A4A" stroke-width="0.75" stroke-opacity="0.1"/>
      <circle cx="20" cy="20" r="2" fill="#2D4030" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="750" fill="url(#bgGrad)"/>
  <rect width="600" height="750" fill="url(#islamicPattern)"/>
  <circle cx="300" cy="280" r="220" fill="url(#haloGrad)"/>

  <!-- Outer Elegant Frame -->
  <rect x="24" y="24" width="552" height="702" rx="16" fill="none" stroke="#9C7A4A" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="34" y="34" width="532" height="682" rx="12" fill="none" stroke="#2D4030" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Corner Ornaments -->
  <g stroke="#9C7A4A" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M44 64 L64 44 M44 54 L54 44 M44 74 L74 44"/>
    <path d="M556 64 L536 44 M556 54 L546 44 M556 74 L526 44"/>
    <path d="M44 686 L64 706 M44 696 L54 706 M44 676 L74 706"/>
    <path d="M556 686 L536 706 M556 696 L546 706 M556 676 L526 706"/>
  </g>

  <!-- Islamic Arch Portal -->
  <path d="M120 480 L120 270 Q120 120 300 90 Q480 120 480 270 L480 480 Z" fill="#FAF8F5" fill-opacity="0.75" stroke="#9C7A4A" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M136 480 L136 276 Q136 138 300 110 Q464 138 464 276 L464 480 Z" fill="none" stroke="#2D4030" stroke-width="0.75" stroke-opacity="0.35"/>

  <!-- Central Crest / Calligraphic Seal -->
  <circle cx="300" cy="260" r="80" fill="#FAF8F5" stroke="#9C7A4A" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="300" cy="260" r="70" fill="none" stroke="#2D4030" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="300" cy="260" r="62" fill="#2D4030" fill-opacity="0.04"/>

  <!-- Arabic Rahimahullah Motif -->
  <text x="300" y="272" font-family="'Amiri', 'Traditional Arabic', serif" font-size="34" fill="#2D4030" text-anchor="middle" font-weight="bold">
    رَحِمَهُ اللَّهُ
  </text>
  <text x="300" y="294" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#9C7A4A" text-anchor="middle" letter-spacing="3" font-weight="600">
    RAHIMAHULLAH
  </text>

  <!-- Subtle Crescent & Floral Motif below arch -->
  <path d="M260 380 Q300 400 340 380 Q300 388 260 380 Z" fill="#9C7A4A" opacity="0.6"/>
  <circle cx="300" cy="370" r="4" fill="#2D4030" opacity="0.5"/>

  <!-- Informative Respectful Placeholder Typography -->
  <g font-family="'Playfair Display', serif" text-anchor="middle">
    <text x="300" y="540" font-size="24" fill="#2D4030" font-weight="700" letter-spacing="0.5">
      H. Muhammad Hasan
    </text>
  </g>

  <g font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">
    <text x="300" y="575" font-size="13" fill="#5F6B64" letter-spacing="3" font-weight="600">
      FOTO KENANGAN KELUARGA
    </text>
    <text x="300" y="605" font-size="12" fill="#7C8881" letter-spacing="0.5">
      Dapat digantikan dengan file foto:
    </text>
    <text x="300" y="626" font-size="13" fill="#9C7A4A" font-weight="600" font-family="monospace">
      public/images/almarhum.jpg
    </text>
  </g>

  <!-- Bottom Floral Divider -->
  <path d="M220 660 L285 660 M315 660 L380 660" stroke="#9C7A4A" stroke-width="1" stroke-opacity="0.5"/>
  <polygon points="300,654 306,660 300,666 294,660" fill="#9C7A4A" opacity="0.7"/>
</svg>
